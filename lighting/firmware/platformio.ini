; Ozark lighting controller firmware (protocol: ../PROTOCOL.md)
;   pio run                 build
;   pio run -t upload       flash over USB
;   pio device monitor      serial console (460800)

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 460800
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3
build_flags =
    -DFW_VERSION=\"3.0.0\"
