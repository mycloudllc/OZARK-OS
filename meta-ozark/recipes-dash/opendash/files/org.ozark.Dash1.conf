<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Dash (running as root) owns org.ozark.Dash1: media, radio, volume and theme
     for ozark-remoted, the phone app's service. -->
<busconfig>
  <policy user="root">
    <allow own="org.ozark.Dash1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.ozark.Dash1"/>
  </policy>
</busconfig>
