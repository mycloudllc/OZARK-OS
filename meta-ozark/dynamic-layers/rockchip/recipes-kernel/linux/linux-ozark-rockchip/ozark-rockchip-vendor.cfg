# Ozark OS on Rockchip's 6.1 kernel (Armbian's rk-6.1, on top of Armbian's
# linux-rk35xx-vendor.config in linux-ozark-rockchip/defconfig)

# Built with Yocto's GCC, not the one Armbian tests with
# CONFIG_WERROR is not set

# Wi-Fi through brcmfmac (hostapd AP mode), not Broadcom's bcmdhd
# CONFIG_AP6XXX is not set

# GPU through panfrost (Mesa), not Rockchip's Mali blob drivers
# CONFIG_MALI_MIDGARD is not set
# CONFIG_MALI_BIFROST is not set
CONFIG_DRM_PANFROST=m

# Android Auto's video: the VDPU through V4L2 for v4l2slh264dec (0002). Built
# in, not a module: GStreamer looks for the device when OpenDash starts.
CONFIG_VIDEO_HANTRO=y
CONFIG_VIDEO_HANTRO_ROCKCHIP=y

# Waveshare DSI panel and its polled touch (0001)
CONFIG_DRM_PANEL_WAVESHARE_TOUCHSCREEN=m
CONFIG_TOUCHSCREEN_GT911_POLLED=m

# Phones: Bluetooth LE, RFCOMM (wireless Android Auto, calls), PAN
CONFIG_BT_LE=y
CONFIG_BT_RFCOMM=m
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=m
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y
CONFIG_BT_HCIUART_SERDEV=y

# Hotspot internet sharing (systemd-networkd IPMasquerade: nftables)
CONFIG_NF_TABLES=m
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_TABLES_IPV6=y
CONFIG_NFT_CT=m
CONFIG_NFT_NAT=m
CONFIG_NFT_MASQ=m
CONFIG_NF_NAT=m

# LTE modems and phone tethering over USB
CONFIG_USB_NET_CDCETHER=m
CONFIG_USB_NET_CDC_NCM=m
CONFIG_USB_NET_CDC_MBIM=m
CONFIG_USB_NET_QMI_WWAN=m
CONFIG_USB_NET_RNDIS_HOST=m
CONFIG_USB_WDM=m

# USB Wi-Fi adapters ozark-hotspot can use as its second radio
CONFIG_WLAN_VENDOR_MEDIATEK=y
CONFIG_MT76x0U=m
CONFIG_MT76x2U=m
CONFIG_MT7921U=m
CONFIG_WLAN_VENDOR_RALINK=y
CONFIG_RT2X00=m
CONFIG_RT2800USB=m
CONFIG_RT2800USB_RT33XX=y
CONFIG_RT2800USB_RT35XX=y
CONFIG_RT2800USB_RT53XX=y
CONFIG_RT2800USB_RT55XX=y

# USB serial lighting controllers (WLED, Adalight) and USB audio
CONFIG_USB_SERIAL_CH341=m
CONFIG_USB_SERIAL_CP210X=m
CONFIG_USB_ACM=m
CONFIG_SND_USB_AUDIO=m

# CAN (vehicle bus) for SPI/USB CAN adapters
CONFIG_CAN_RAW=m
CONFIG_CAN_GS_USB=m
CONFIG_CAN_MCP251XFD=m

CONFIG_UINPUT=m
CONFIG_DRM_FBDEV_EMULATION=y
