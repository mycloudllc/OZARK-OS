# Ozark OS defaults for Dash. Qt reads this system-wide file for any setting
# that isn't in the user's own ~/.config/openDsh/dash.conf, so choices made in
# Dash's UI are saved there and take precedence over these.

[Layout]
# Control bar shows the "android auto" quick view (next turn + now playing).
# Index into Dash's list: none, volume, brightness, combo, android auto.
ControlBar\quick_view=4

[Pages]
# TrailCommand is the active vehicle plugin (Vehicle page > settings shows it selected)
Vehicle\plugin=trailcommand
# Launcher plugins loaded at startup, as a numbered list (names as Dash shows
# them: the library name with "_" as spaces): a tab each for the lighting controllers
Launcher\0=interior lighting
Launcher\1=exterior lighting

[Core]
# Mouse pointer off (Settings > Main > Cursor turns it back on)
cursor=false
