<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- ozark-vehicled owns org.ozark.Vehicle1; anything on the head unit may use it
     (Dash's Vehicle page and settings, scripts). -->
<busconfig>
  <policy user="root">
    <allow own="org.ozark.Vehicle1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.ozark.Vehicle1"/>
  </policy>
</busconfig>
