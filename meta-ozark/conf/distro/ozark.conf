# Ozark OS — a lean, systemd-based distro for an in-vehicle display.
# Built on top of Poky's defaults, minus the desktop stacks we don't use.

require conf/distro/poky.conf

DISTRO = "ozark"
DISTRO_NAME = "Ozark OS"
DISTRO_VERSION = "0.2.0"
DISTRO_CODENAME = "trailhead"
MAINTAINER = "Ozark Mountain Technologies"
# TARGET_VENDOR stays "-poky" so the public sstate mirror (kas/mirrors.yml) still matches.

INIT_MANAGER = "systemd"

# Raspberry Pi: ship every overlay the kernel builds, like Raspberry Pi OS does,
# so add-on boards only need a dtoverlay= line in config.txt.
require conf/distro/include/ozark-rpi-overlays.inc

# The radio's screen: a Waveshare 8" DSI panel (1280x800, Goodix touch),
# enabled in config.txt. Build fragments for other screens replace it
# (kas/display-rpi7.yml); set it to "" in local.conf for an HDMI screen.
OZARK_DISPLAY_OVERLAY ??= "vc4-kms-dsi-waveshare-panel,8_0_inch"
RPI_EXTRA_CONFIG:append:rpi = "${@'\ndtoverlay=' + d.getVar('OZARK_DISPLAY_OVERLAY') + '\n' if d.getVar('OZARK_DISPLAY_OVERLAY') else ''}"

# Splash sooner: the display (vc4, built in) waits for the panel driver and its
# I2C bus mux, which otherwise load as modules late in udev's boot-time rush
# (~4.5 s). Loading them from modules-load.d brings the screen up ~2 s earlier.
KERNEL_MODULE_AUTOLOAD:append:rpi = "${@' i2c-mux-pinctrl panel-waveshare-dsi' if 'waveshare' in (d.getVar('OZARK_DISPLAY_OVERLAY') or '') else ''}"

# Raspberry Pi SD card layout: boot, system slots A and B, OZARKLOGS for
# ozark-logs, and data (ozark-data). See classes/ozark-slots.bbclass.
WKS_FILE:rpi = "ozark-sdimage.wks.in"

# The firmware loads the system (kernel, dtbs, overlays, cmdline.txt) from
# slot A's folder. ozark-update rewrites this line when an update is committed.
RPI_EXTRA_CONFIG:append:rpi = "\n[all]\nos_prefix=a/\n"

# Single fullscreen Qt app straight on KMS/DRM (EGLFS): no X11, no Wayland.
# Keep "opengl" — Mesa's GLES/EGL for the Pi's V3D GPU depends on it.
DISTRO_FEATURES:remove = "x11 wayland vulkan 3g nfc nfs zeroconf pcmcia ptest"
DISTRO_FEATURES:append = " opengl"

# --- Qt 5 for EGLFS ----------------------------------------------------------
# With opengl on and x11 off, meta-qt5 already builds qtbase with
# "kms gbm gles2 eglfs". Add touch/keyboard (libinput), system fonts, and
# xkbcommon: without it Qt's libinput keyboard drops every key press (meta-qt5
# only enables it with x11), so volume keys and Dash's shortcuts never arrive.
PACKAGECONFIG:append:pn-qtbase = " libinput fontconfig xkbcommon"

# Hands-free calls: PulseAudio routes HFP audio through oFono. Poky only turns
# this on with the "3g" distro feature, which Ozark removes (no modem).
PACKAGECONFIG:append:pn-pulseaudio = " ofono"

# Media > Local: Opus decoding (gstreamer1.0-plugins-base-opus)
PACKAGECONFIG:append:pn-gstreamer1.0-plugins-base = " opus"

# LTE (ModemManager): no Vala bindings needed, saves building the Vala compiler
PACKAGECONFIG:remove:pn-modemmanager = "vala"

# Slimmer images: English only
IMAGE_LINGUAS = ""
GLIBC_GENERATE_LOCALES = "en_US.UTF-8"
