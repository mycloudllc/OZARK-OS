# Ozark OS: start bluetoothd even before (or without) an adapter.
#
# Upstream skips the service unless /sys/class/bluetooth already exists. On the
# Pi the UART adapter is registered by hciuart, which can be later than that
# check, and in QEMU there is none. Either way org.bluez is then missing on
# D-Bus, and Dash's Bluetooth setup waits out two D-Bus timeouts (~50 s) before
# its UI appears. bluetoothd runs fine without adapters and picks them up when
# they appear.
[Unit]
ConditionPathIsDirectory=

# Without the hostname plugin, so the adapter keeps main.conf's Name
# ("TrailCommand Radio") instead of being renamed to the hostname
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd -P hostname
