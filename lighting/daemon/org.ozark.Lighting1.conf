<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- ozark-lightd owns org.ozark.Lighting1; anything on the head unit may use it
     (Dash's lighting tabs, scripts, CAN or ignition handlers). -->
<busconfig>
  <policy user="root">
    <allow own="org.ozark.Lighting1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.ozark.Lighting1"/>
  </policy>
</busconfig>
