<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- ozark-remoted owns org.ozark.Remote1 (Dash shows its pairing code and lists
     the phones). BlueZ calls into its GATT objects and advertisement, which
     the default policy allows for root-owned services' replies; bluetoothd
     runs as root too. -->
<busconfig>
  <policy user="root">
    <allow own="org.ozark.Remote1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.ozark.Remote1"/>
  </policy>
</busconfig>
