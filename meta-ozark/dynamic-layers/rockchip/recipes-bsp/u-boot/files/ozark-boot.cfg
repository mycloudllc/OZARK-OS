# Ozark OS: boot.scr (ozark-boot) picks the system slot from files on the
# boot partition and writes tried.txt before a trial boot: FAT write,
# load and env import
CONFIG_CMD_FAT=y
CONFIG_FAT_WRITE=y
CONFIG_CMD_FS_GENERIC=y
CONFIG_CMD_IMPORTENV=y
CONFIG_CMD_EXPORTENV=y
# A quick boot: no countdown (Ctrl+C on the serial console still stops it)
CONFIG_BOOTDELAY=0
# The "download button" is the audio jack's microphone input: a 3-pin plug
# would hold the board in download mode instead of booting
CONFIG_ROCKCHIP_BOOT_MODE_REG=0
