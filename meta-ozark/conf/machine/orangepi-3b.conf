#@TYPE: Machine
#@NAME: Orange Pi 3B (v2.1)
#@DESCRIPTION: Xunlong Orange Pi 3B v2.1: Rockchip RK3566, Mali-G52 (panfrost), BCM43456 Wi-Fi/Bluetooth, for Ozark OS
#
# Needs meta-rockchip (rk3566.inc, the boot blobs) and meta-arm (kas/ozark-opi3b.yml).
# Board-specific recipes: meta-ozark/dynamic-layers/rockchip/.

# Built for the Cortex-A72, like the Raspberry Pi 4 build: the code runs on
# the RK3566's Cortex-A55 cores (both ARMv8-A), and every package that isn't
# board-specific is shared with the Pi build's cache instead of rebuilt.
DEFAULTTUNE = "cortexa72"
require conf/machine/include/arm/armv8a/tune-cortexa72.inc

require conf/machine/include/rk3566.inc

# --- Kernel: Rockchip's 6.1 (linux-ozark-rockchip) --------------------------
# Mainline (linux-ozark-mainline, 6.12) runs the board, but its DSI1 gives the
# Waveshare panel only a black picture (also 6.18); Rockchip's kernel drives
# it. Both kernels name their panel device tree the same, so the slots and
# updates don't change. To go back to mainline:
#   PREFERRED_PROVIDER_virtual/kernel = "linux-ozark-mainline"
PREFERRED_PROVIDER_virtual/kernel = "linux-ozark-rockchip"
KERNEL_IMAGETYPE = "Image"
KERNEL_CLASSES = ""
KERNEL_DEVICETREE = " \
    rockchip/rk3566-orangepi-3b-v2.1.dtb \
    rockchip/rk3566-orangepi-3b-v2.1-ozark-waveshare8.dtb \
"
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

# The device tree each slot boots (its ozark.dtb). The Waveshare 8" DSI panel
# on the Pi-style DSI connector (with Rockchip's kernel HDMI is then off); for
# HDMI only:
#   OZARK_BOOT_DTB = "rk3566-orangepi-3b-v2.1.dtb"
OZARK_BOOT_DTB ?= "rk3566-orangepi-3b-v2.1-ozark-waveshare8.dtb"

# --- U-Boot (mainline 2026.01, u-boot_%.bbappend) ---------------------------
UBOOT_MACHINE = "orangepi-3b-rk3566_defconfig"

# Not meta-rockchip's extlinux boot: boot.scr picks system slot A or B
# (ozark-boot), with the kernel and device tree on the boot partition
UBOOT_EXTLINUX = "0"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "u-boot-extlinux kernel-image kernel-devicetree"

# --- SD card: the A/B layout (classes/ozark-slots.bbclass) ------------------
WKS_FILE = "ozark-sdimage-rockchip.wks.in"
IMAGE_FSTYPES:remove = "wic"
# The SD card is mmcblk1 here (mmc0 is the eMMC slot, mmc2 the Wi-Fi)
OZARK_SLOT_DISK = "/dev/mmcblk1"
OZARK_BOOTLOADER = "uboot"

# --- Wi-Fi/Bluetooth, GPU ---------------------------------------------------
MACHINE_EXTRA_RRECOMMENDS += "ozark-bcm43456-firmware"
# Wi-Fi for Android Auto is an RTL8822CE card in the M.2 slot (rtw88_8822ce,
# in kernel-modules); the onboard BCM43456 Wi-Fi is blacklisted in the kernel
# recipe, its Bluetooth (UART) stays in use
MACHINE_EXTRA_RRECOMMENDS += "linux-firmware-rtl8822"
MACHINE_FEATURES += "wifi bluetooth"
