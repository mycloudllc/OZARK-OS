# meta-ozark: Ozark OS distro, images, branding and apps.
# Board-agnostic on purpose. Anything specific to one BSP lives under
# dynamic-layers/<bsp-collection>/ and is only parsed when that BSP layer is present.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILES_DYNAMIC += "\
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/*/*/*.bb \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "ozark"
BBFILE_PATTERN_ozark = "^${LAYERDIR}/"
BBFILE_PRIORITY_ozark = "10"

LAYERVERSION_ozark = "1"
LAYERDEPENDS_ozark = "core openembedded-layer qt5-layer swupdate"
LAYERSERIES_COMPAT_ozark = "scarthgap"

# Update signing keys (scripts/make-keys.sh): keys/ next to this layer
OZARK_LAYERDIR := "${LAYERDIR}"
OZARK_KEYS_DIR ?= "${OZARK_LAYERDIR}/../keys"
