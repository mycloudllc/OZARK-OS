# Ozark OS: BlueZ settings for a car head unit. Only what differs from
# BlueZ's defaults; see bluetoothd's main.conf(5) for the rest.

[General]
# The name phones show when pairing (the adapter's alias, once set, is kept in
# /var/lib/bluetooth). bluetoothd runs without its hostname plugin, which would
# otherwise replace this with the hostname.
Name = TrailCommand Radio

# Audio/Video major class, "Car audio" minor class: phones show a car icon and
# offer the head-unit profiles (BlueZ adds the service bits itself)
Class = 0x000420

# Visible only while Settings > Phone's "pair new phone" is on (it sets the
# timeout too); pairable at all times so known phones can re-pair
DiscoverableTimeout = 180
PairableTimeout = 0

# Faster reconnection of known phones, for a little more power while idle
FastConnectable = true

[Policy]
# Power the adapter at boot and retry phones that drop out of range
AutoEnable = true
ReconnectAttempts = 7
ReconnectIntervals = 1, 2, 4, 8, 16, 32, 64
